
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CarePlus24</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            padding: 20px;

            background:
                radial-gradient(circle at 10% 10%, #b9f0f1 0, transparent 30%),
                radial-gradient(circle at 90% 90%, #c5f2ef 0, transparent 35%),
                linear-gradient(135deg, #e9fbfc, #f6fbfc, #dff7f7);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: rgba(255,255,255,0.96);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(8,127,140,0.13);
        }

        .logo {
            text-align: center;
            color: #087f8c;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .heading p {
            color: #64748b;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #334155;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #087f8c;
            box-shadow: 0 0 0 3px rgba(8,127,140,0.1);
        }

        .login-button {
            width: 100%;
            background: #087f8c;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #066873;
        }

        .login-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            line-height: 1.5;
        }

        .error-message {
            color: #dc2626;
        }

        .success-message {
            color: #15803d;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
        }

        .register-link a {
            color: #087f8c;
            font-weight: bold;
            text-decoration: none;
        }

        .home-link {
            text-align: center;
            margin-top: 20px;
        }

        .home-link a {
            color: #64748b;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">✚ CarePlus24</div>

        <div class="heading">
            <h1>Welcome Back</h1>

            <p>
                Login to your CarePlus24 account
                to manage your healthcare.
            </p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Login
            </button>

            <p id="message"></p>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Register here</a>
        </div>

        <div class="home-link">
            <a href="/">← Back to Home</a>
        </div>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            message.textContent = "";
            message.className = "";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {

                loginButton.disabled = true;
                loginButton.textContent = "Logging in...";

                const response = await fetch("/api/auth/login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const result = await response.json();

                if (response.ok) {

                    message.textContent = result.message;
                    message.className = "success-message";

                    setTimeout(function() {
                        window.location.href = "/dashboard";
                    }, 800);

                } else {

                    message.textContent = result.message;
                    message.className = "error-message";

                }

            } catch (error) {

                message.textContent =
                    "Unable to connect to the server.";

                message.className = "error-message";

                console.error(error);

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "Login";

            }

        });
    </script>

</body>
</html>
